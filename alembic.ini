# Alembic 配置文件

[alembic]
# 迁移脚本存放路径
script_location = db/migrations

# 迁移脚本模板文件（可选，使用默认）
# script_template = %%(year)d_%%(month).2d_%%(day).2d-%%(rev)s_%%(slug)s

# 时区设置（用于生成迁移文件的时间戳）
# timezone =

# 数据库连接 URL（从环境变量读取）
sqlalchemy.url = %(DATABASE_URL_SYNC)s

# 版本路径分隔符（默认为 os.sep）
# version_path_separator = os

# 输出编码
# output_encoding = utf-8

[post_write_hooks]
# 迁移文件生成后执行的钩子（可选）

